name: CI

on:
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commit messages (conventional commits drive releases)
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit production dependencies
        # Only --omit=dev: these are the packages that actually ship to users.
        # The dev tree carries advisories that CANNOT be fixed from this repo —
        # see SECURITY.md — and gating on them would train everyone to ignore a
        # red audit, hiding a real one when it appears.
        run: npm audit --omit=dev --audit-level=high
